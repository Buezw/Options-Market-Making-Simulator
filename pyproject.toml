[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-options-mm"
version = "0.1.0"
description = "Event-driven backtester for market making in BTC options on Deribit order book data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jingnan Huang" }]
dependencies = [
    "numpy",
    "scipy",
    "websockets",
    "httpx",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/btc_options_mm"]
